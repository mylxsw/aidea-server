name: External payment tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  external-payment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run payment unit and end-to-end tests
        run: ./scripts/test-external-pay.sh
