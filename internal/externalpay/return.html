<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>返回应用</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #263c3e;
      background: #f7faf9;
    }

    body {
      min-width: 280px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 28px;
      display: grid;
      place-items: center;
    }

    main {
      width: min(100%, 440px);
      text-align: center;
    }

    svg {
      width: 54px;
      height: 54px;
      color: #2c8175;
    }

    h1 {
      margin: 25px 0 0;
      font-size: clamp(25px, 5vw, 32px);
      font-weight: 620;
      line-height: 1.35;
      letter-spacing: -.025em;
    }

    p {
      margin: 13px 0 0;
      color: #687e7d;
      font-size: 15px;
      line-height: 1.7;
    }

    @media (prefers-color-scheme: dark) {
      :root { color: #eef5f3; background: #142023; }
      svg { color: #76c6b6; }
      p { color: #a5b9b5; }
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="6" y="6" width="44" height="44" rx="13"></rect>
      <path d="M37 28H19m0 0 7-7m-7 7 7 7"></path>
    </svg>
    <h1>回到应用查看结果</h1>
    <p>未自动关闭？请关闭此标签页。</p>
  </main>
  <script>
    try { history.replaceState(null, '', window.location.pathname); } catch (_) {}
    window.setTimeout(() => { try { window.close(); } catch (_) {} }, 900);
  </script>
</body>
</html>
